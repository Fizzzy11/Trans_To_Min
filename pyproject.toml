[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trans-to-min"
dynamic = ["version"]
description = "A股逐笔数据转自定义分钟数据框架"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=14,<25",
]

[project.urls]
Repository = "https://github.com/Fizzzy11/Trans_To_Min"

[tool.setuptools.packages.find]
include = ["trans_to_min*"]

[tool.setuptools.dynamic]
version = {attr = "trans_to_min._version.__version__"}
